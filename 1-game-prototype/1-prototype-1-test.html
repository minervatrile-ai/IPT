<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Skull Influencer</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h3 {
      color: #b4438c;
    }

    .game {
      position: relative;
      height: 500px;
      border: 3px solid white;
      overflow: hidden;
      background: #111;
    }

    #enemy {
      position: absolute;
      left: 100px;
      top: 100px;
      cursor: crosshair;
      font-size: 1rem;
      user-select: none;
    }

    .hit {
      transform: scale(1.25);
    }

    #scoreboard {
      font-size: 1.5rem;
      margin: 15px;
    }

    #effect {
      font-size: 2rem;
      margin-top: 20px;
    }

    #enemy img {
  width: 140px;
  height: auto;
  display: block;
  margin: 0 auto;
}
  </style>
</head>

<body>

  <h1>📺💀 The Skull Influencer</h1>
  <a href="1-console.html"><h3>Go back...</h3></a>

  <div class="hud">
    <button onclick="selectWeapon('tomato')">🍅 IPT Tomatoes</button>
    <button onclick="selectWeapon('mirror')">🪞 Mirror Engine</button>
    <button onclick="selectWeapon('pause')">⏸️ Pause Field</button>
  </div>

  <div id="scoreboard">Score: <span id="score">0</span></div>

  <div class="game">

  <div id="enemy" onclick="hitEnemy()">
  <img id="enemy-img"
       src="../gallery/1-game-images/1-game-skull-influencer.png"
       alt="The Skull Influencer">

  <div id="quote">YOUR WORLDVIEW IS UNDER THREAT!</div>
</div>

    <div id="effect"></div>
  </div>

  <script>
    let weapon = "tomato";
    let score = 0;

    const quotes = [
      "YOUR WORLDVIEW IS UNDER THREAT!",
      "ENGAGE IMMEDIATELY!",
      "YOU MUST PICK A SIDE!",
      "EVERYTHING IS AN EMERGENCY!",
      "OUTRAGE GENERATES CLICKS!"
    ];

const enemyImages = {
  normal: "../gallery/1-game-images/1-game-skull-influencer.png",
  tomato: "../gallery/1-game-images/1-game-skull-influencer-hit-tomato.png",
  mirror: "../gallery/1-game-images/1-game-skull-influencer-hit-mirror.png",
  pause: "../gallery/1-game-images/1-game-skull-influencer-hit-pause.png"
};

    function selectWeapon(choice) {
      weapon = choice;
    }

    function hitEnemy() {
      const enemyImg = document.getElementById("enemy-img");

      score++;
      document.getElementById("score").textContent = score;

      const effect = document.getElementById("effect");
      const enemy = document.getElementById("enemy");

      if (weapon === "tomato") {
        effect.textContent = "🍅 SPLAT!";
        enemyImg.src = enemyImages.tomato;
      } else if (weapon === "mirror") {
        effect.textContent = "🪞 MANIPULATION REFLECTED!";
        enemyImg.src = enemyImages.mirror;
      } else if (weapon === "pause") {
        effect.textContent = "⏸️ SIGNAL SLOWED!";
        enemyImg.src = enemyImages.pause;
      }

      document.getElementById("quote").textContent =
        quotes[Math.floor(Math.random() * quotes.length)];

      enemy.classList.add("hit");

      setTimeout(() => {
        enemy.classList.remove("hit");
        effect.textContent = "";
        enemyImg.src = enemyImages.normal;
      }, 1500);

      moveEnemy();
    }

    function moveEnemy() {
      const enemy = document.getElementById("enemy");
      const game = document.querySelector(".game");

      const maxX = game.clientWidth - enemy.offsetWidth;
      const maxY = game.clientHeight - enemy.offsetHeight;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      enemy.style.left = randomX + "px";
      enemy.style.top = randomY + "px";
    }

    window.onload = function() {
    moveEnemy();
    setInterval(moveEnemy, 1200);
};
  </script>

</body>
</html>
