<!DOCTYPE html>
<html>
<head>
  <title>Basic Text Maze</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      text-align: center;
    }

    #maze {
      white-space: pre;
      font-family: monospace;
      font-size: 50px;
      line-height: 1;
      margin: 20px;
      overflow-x: auto;
    }

    button {
      font-size: 20px;
      margin: 5px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>

<!-- change 2: altering FONT SIZE from 40 to 50px, and line height from 1.1 to 1. change 1: in #maze; GOAL=altering FONT SIZE to make maze zoomed bigger, VIA changing maze line-height from 24px to 1.1, adding font-family: monospace, changing font-size from 24px to 40px, leaving white-space the same (pre;) , leaving margin: 20px. also for phone screens i will try adding "overflow-x: auto;" AND there are more possible options in notepad "4-instructions-font-size.txt" in "2-game-maze" folder. -->

<h1>Text Maze Prototype</h1>

<div id="maze"></div>

<button onclick="movePlayer(0, -1)">⬆️ Up</button><br>
<button onclick="movePlayer(-1, 0)">⬅️ Left</button>
<button onclick="movePlayer(1, 0)">➡️ Right</button><br>
<button onclick="movePlayer(0, 1)">⬇️ Down</button>

<p id="message">Unlock the padlock, leave room, get the books, dodge the villain. Pardon: all the Object Activation is in development... Return to this letter P for these instructions to appear.</p>

<script>
const maze = [
"###########################",
"#PBC S KO#                #",
"#    T  F#         W      #",
"#        #                #",
"#####U####                #",
"#                         #",
"#                         #",
"#                         #",
"#               VD        #",
"###########################"
];

let playerX = 1;
let playerY = 1;

function drawMaze() {
  let display = "";

  for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {
      if (x === playerX && y === playerY) {
        display += "🧙‍♂️";
      } else {

  let cell = maze[y][x];

  if (cell === "#") display += "🧱";
  else if (cell === "R") display += "📻";
  else if (cell === "D") display += "🚪";
  else if (cell === "K") display += "🗝️";
  else if (cell === "T") display += "📺";
  else if (cell === "S") display += "🛋️";
  else if (cell === "B") display += "⌨️";
  else if (cell === "C") display += "🖥️";
  else if (cell === "L") display += "🔒";
  else if (cell === "U") display += "🔓";
  else if (cell === "V") display += "👹";
  else if (cell === "F") display += "🗄️";
  else if (cell === "O") display += "🗃️";
  else if (cell === "W") display += "📚";
  
  else display += cell;

}
    }
    display += "\n";
  }

  document.getElementById("maze").textContent = display;
}

function movePlayer(dx, dy) {
  let newX = playerX + dx;
  let newY = playerY + dy;

  let nextSpace = maze[newY][newX];

  if (nextSpace === "#") {
    document.getElementById("message").textContent = "A wall is here. Are you reading the writing on the wall or what?";
    return;
  }

  playerX = newX;
  playerY = newY;

  if (nextSpace === "T") {
    document.getElementById("message").textContent = "Hey, wizard! Don't block the television set, man!";
  } else {
    document.getElementById("message").textContent = "Where is the damn key at?";
  }

  drawMaze();
}

drawMaze();
</script>

</body>
</html>
