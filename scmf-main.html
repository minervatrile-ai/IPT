// ------------------------------------------------------------

function getActiveVehicles() {
  return VEHICLES_BY_MAP[currentMap] || [];
}

function getVehicleById(id) {
  for (const mapName in VEHICLES_BY_MAP) {
    const found = VEHICLES_BY_MAP[mapName].find(v => v.id === id);
    if (found) return found;
  }

  return null;
}

function moveVehicleToMap(vehicle, targetMap, x, y, facing, width, height) {
  for (const mapName in VEHICLES_BY_MAP) {
    VEHICLES_BY_MAP[mapName] = VEHICLES_BY_MAP[mapName].filter(v => v.id !== vehicle.id);
  }

  vehicle.x = x;
  vehicle.y = y;
  vehicle.facing = facing;
  vehicle.width = width;
  vehicle.height = height;

  VEHICLES_BY_MAP[targetMap].push(vehicle);
}

function getActiveMap() {
  if (OUTSIDE_MAPS[currentMap]) {
    return OUTSIDE_MAPS[currentMap];
  }

  return BLUEPRINTS[currentMap];
}

function getActiveWidth() {
  return getActiveMap()[0].length;
}

function getActiveHeight() {
  return getActiveMap().length;
}

function inBounds(x, y) {
  return x >= 0 && x < getActiveWidth() && y >= 0 && y < getActiveHeight();
}

function getVehicleFootprint(vehicle) {
  const spots = [];

  for (let yy = 0; yy < vehicle.height; yy++) {
    for (let xx = 0; xx < vehicle.width; xx++) {
      spots.push({
        x: vehicle.x + xx,
        y: vehicle.y + yy
      });
    }
  }

  return spots;
}

function isOccupiedByVehicle(x, y, ignoreVehicleId = null) {
  for (const vehicle of getActiveVehicles()) {
    if (vehicle.id === ignoreVehicleId) continue;

    const footprint = getVehicleFootprint(vehicle);

    for (const spot of footprint) {
      if (spot.x === x && spot.y === y) return true;
    }
  }

  return false;
}

function isOccupiedByBuilding(x, y) {
  for (const building of buildings) {
    const localX = x - building.x;
    const localY = y - building.y;

    if (
      localX < 0 ||
      localY < 0 ||
      localX >= building.width ||
      localY >= building.height
    ) {
      continue;
    }

    const row = building.collision[localY];
    const cell = row[localX];

    if (cell === "X") return true;
  }

  return false;
}

function isOccupiedByInteriorTile(x, y) {
  const symbol = BLUEPRINTS[currentMap]?.[y]?.[x];

  if (symbol === "W") return true;
  if (symbol === "T") return true;
  if (symbol === "C") return true;
  if (symbol === "B") return true;

  return false;
}

function areAdjacent(aX, aY, bX, bY) {
  return Math.abs(aX - bX) + Math.abs(aY - bY) === 1;
}

function updateCamera() {
  const camera = document.getElementById("camera");

  const viewW = camera.clientWidth;
  const viewH = camera.clientHeight;

  const mapW = getActiveWidth() * TILE_SIZE;
  const mapH = getActiveHeight() * TILE_SIZE;

  let targetX;
  let targetY;

  if (mode === "driving" && currentVehicle) {
    targetX = currentVehicle.x * TILE_SIZE + (currentVehicle.width * TILE_SIZE) / 2;
    targetY = currentVehicle.y * TILE_SIZE + (currentVehicle.height * TILE_SIZE) / 2;
  } else {
    targetX = player.x * TILE_SIZE + TILE_SIZE / 2;
    targetY = player.y * TILE_SIZE + TILE_SIZE / 2;
  }

  let camX = targetX - viewW / 2;
  let camY = targetY - viewH / 2;

  camX = Math.max(0, Math.min(camX, Math.max(0, mapW - viewW)));
  camY = Math.max(0, Math.min(camY, Math.max(0, mapH - viewH)));

  game.style.transform = `translate(${-camX}px, ${-camY}px)`;
}

          ${index + 1}. ${option}
        </div>
      `).join("")}
      <p class="phoneHint">Arrow keys: choose | E: select | B: hang up</p>
    </div>
  `;

  document.body.appendChild(overlay);
}

function openVehicleRequestMenu() {
  phoneScreen = "vehicles";
  vehicleRequestIndex = 0;
  drawVehicleRequestMenu();
}

function drawVehicleRequestMenu() {
  let oldOverlay = document.getElementById("phoneOverlay");
  if (oldOverlay) oldOverlay.remove();

  const overlay = document.createElement("div");
  overlay.id = "phoneOverlay";

  overlay.innerHTML = `
    <div id="phoneImage"></div>
    <div id="phoneMenu">
      <h2>VEHICLE REQUESTS</h2>
      ${vehicleRequestOptions.map((option, index) => `
        <div class="phoneOption ${index === vehicleRequestIndex ? "selected" : ""}">
          ${index + 1}. ${option}
        </div>
      `).join("")}
      <p class="phoneHint">Arrow keys: choose | E: request | B: back</p>
    </div>
  `;

  document.body.appendChild(overlay);
}

function handleMainPhoneMenu(key) {
  if (key === "arrowup") {
    phoneMenuIndex = Math.max(0, phoneMenuIndex - 1);
    drawPhoneOverlay();
    return;
  }

  if (key === "arrowdown") {
    phoneMenuIndex = Math.min(phoneOptions.length - 1, phoneMenuIndex + 1);
    drawPhoneOverlay();
    return;
  }

  if (key === "e") {
    const option = phoneOptions[phoneMenuIndex];

    if (option === "Hang Up") {
      closePhoneOverlay();
      return;
    }

    if (option === "Vehicle Requests") {
      openVehicleRequestMenu();
      return;
    }

    setMessage("Selected: " + option);
    return;
  }

  if (key === "b") {
    closePhoneOverlay();
  }
}

function handleVehicleRequestMenu(key) {
  if (key === "arrowup") {
    vehicleRequestIndex = Math.max(0, vehicleRequestIndex - 1);
    drawVehicleRequestMenu();
    return;
  }

  if (key === "arrowdown") {
    vehicleRequestIndex = Math.min(vehicleRequestOptions.length - 1, vehicleRequestIndex + 1);
    drawVehicleRequestMenu();
    return;
  }

  if (key === "b") {
    phoneScreen = "main";
    drawPhoneOverlay();
    return;
  }

  if (key !== "e") return;

  const option = vehicleRequestOptions[vehicleRequestIndex];

  if (option === "Back") {
    phoneScreen = "main";
    drawPhoneOverlay();
    return;
  }

  if (option === "White Fang Snowmobile") {
    requestVehicle("wf-snowmobile");
    return;
  }

  if (option === "Unrecognizer Snowmobile") {
    requestVehicle("green-snowmobile");
    return;
  }

  if (option === "White Fang Operator Vehicle") {
    requestVehicle("wf-operator");
  }
}

function handlePhoneInput(key, event) {
  event.preventDefault();

  if (phoneScreen === "vehicles") {
    handleVehicleRequestMenu(key);
    return;
  }

  handleMainPhoneMenu(key);
}

function requestVehicle(vehicleId) {
  const vehicle = getVehicleById(vehicleId);

  if (!vehicle) {
    setMessage("Vehicle request failed. Unit not found.");
    return;
  }

  if (currentVehicle && currentVehicle.id === vehicle.id) {
    setMessage("That vehicle is already in use.");
    return;
  }

  const deliverySpots = {
    "wf-snowmobile": {
      x: 8,
      y: 11,
      facing: "right",
      width: 2,
      height: 1
    },
    "green-snowmobile": {
      x: 11,
      y: 11,
      facing: "right",
      width: 2,
      height: 1
    },
    "wf-operator": {
      x: 14,
      y: 11,
      facing: "down",
      width: 2,
      height: 2
    }
  };

  const spot = deliverySpots[vehicleId];

  vehicle.occupied = false;
  vehicle.npcDriven = false;
  vehicle.x = spot.x;
  vehicle.y = spot.y;
  vehicle.facing = spot.facing;
  vehicle.width = spot.width;
  vehicle.height = spot.height;

  closePhoneOverlay();
  setMessage(vehicle.name + " delivered outside the SCMF revolving doors.");
  drawGame();
}

function drawGame() {
  game.innerHTML = "";

  const activeMap = getActiveMap();
  const activeTileSet = OUTSIDE_MAPS[currentMap] ? TILE : BLUEPRINT_TILE;

  game.style.gridTemplateColumns = `repeat(${getActiveWidth()}, 64px)`;
  game.style.gridTemplateRows = `repeat(${getActiveHeight()}, 64px)`;

  for (let y = 0; y < getActiveHeight(); y++) {
    for (let x = 0; x < getActiveWidth(); x++) {
      const tile = document.createElement("div");
      tile.className = "tile";

      const symbol = activeMap[y]?.[x] || ".";
      tile.style.backgroundImage = `url("${activeTileSet[symbol]}")`;

      game.appendChild(tile);
    }
  }

if (currentMap === "outside") {
  drawBuildings();
  drawVehicles();
}

if (currentMap === "roadMap") {
  drawVehicles();
}

drawNpcs();

  if (mode === "walking") {
    drawPlayer();
  }

  updateCamera();
  updateHud();
}

function getTile(x, y) {
  const activeWidth = getActiveWidth();
  return game.children[y * activeWidth + x];
}

function addImageToTile(x, y, src, className = "sprite") {
  if (!inBounds(x, y)) return;

  const tile = getTile(x, y);
  if (!tile) return;

  const sprite = document.createElement("div");
  sprite.className = className;
  sprite.style.backgroundImage = `url("${src}")`;
  tile.appendChild(sprite);
}

function drawPlayer() {
  const img = PLAYER_IMAGES[player.facing];
  if (img) addImageToTile(player.x, player.y, img);
}

function drawNpcs() {
  for (const npc of npcs) {
    if (!npc.visible) continue;
    addImageToTile(npc.x, npc.y, npc.image);
  }
}

function drawVehicles() {
  for (const vehicle of getActiveVehicles()) {
    if (currentVehicle && vehicle.id === currentVehicle.id) continue;

    if (vehicle.type === "operator") drawOperatorVehicle(vehicle);
    if (vehicle.type === "snowmobile") drawSnowmobile(vehicle);
    if (vehicle.type === "snowbus") {
  drawSnowbus(vehicle);}
  }

  if (currentVehicle) {
    if (currentVehicle.type === "operator") drawOperatorVehicle(currentVehicle);
    if (currentVehicle.type === "snowmobile") drawSnowmobile(currentVehicle);
    if (currentVehicle.type === "snowbus") drawSnowbus(currentVehicle);
  }
}

function drawBuildings() {
  for (const building of buildings) {
    drawBuilding(building);
  }
}

function drawBuilding(building) {
  const tile = getTile(building.x, building.y);
  const sprite = document.createElement("div");

  sprite.style.position = "absolute";
  sprite.style.left = "0";
  sprite.style.top = "0";
  sprite.style.width = (building.width * TILE_SIZE) + "px";
  sprite.style.height = (building.height * TILE_SIZE) + "px";
  sprite.style.backgroundImage = `url("${building.image}")`;
  sprite.style.backgroundSize = `${building.width * TILE_SIZE}px ${building.height * TILE_SIZE}px`;
  sprite.style.backgroundRepeat = "no-repeat";
  sprite.style.zIndex = "3";
  sprite.style.pointerEvents = "none";

  tile.appendChild(sprite);
}

function drawOperatorVehicle(vehicle) {
  const img = VEHICLE_IMAGES[vehicle.skin].operator.full[vehicle.facing];
  const tile = getTile(vehicle.x, vehicle.y);
  const sprite = document.createElement("div");

  sprite.style.position = "absolute";
  sprite.style.left = "0";
  sprite.style.top = "0";
  sprite.style.width = (vehicle.width * TILE_SIZE) + "px";
  sprite.style.height = (vehicle.height * TILE_SIZE) + "px";
  sprite.style.backgroundImage = `url("${img}")`;
  sprite.style.backgroundSize = `${vehicle.width * TILE_SIZE}px ${vehicle.height * TILE_SIZE}px`;
  sprite.style.backgroundRepeat = "no-repeat";
  sprite.style.zIndex = "6";
  sprite.style.pointerEvents = "none";

  tile.appendChild(sprite);
}

function drawSnowmobile(vehicle) {
  const p = VEHICLE_IMAGES[vehicle.skin].snowmobile.pieces[vehicle.facing];

  if (vehicle.facing === "left") {
    addImageToTile(vehicle.x, vehicle.y, p.front);
    addImageToTile(vehicle.x + 1, vehicle.y, p.rear);
  }

  if (vehicle.facing === "right") {
    addImageToTile(vehicle.x, vehicle.y, p.rear);
    addImageToTile(vehicle.x + 1, vehicle.y, p.front);
  }

  if (vehicle.facing === "up") {
    addImageToTile(vehicle.x, vehicle.y, p.front);
    addImageToTile(vehicle.x, vehicle.y + 1, p.rear);
  }

  if (vehicle.facing === "down") {
    addImageToTile(vehicle.x, vehicle.y, p.rear);
    addImageToTile(vehicle.x, vehicle.y + 1, p.front);
  }
}

function drawSnowbus(vehicle) {
  const img = VEHICLE_IMAGES.snowbus.full[vehicle.facing];

  const tile = getTile(vehicle.x, vehicle.y);

  sprite.style.position = "absolute";

function movePlayer(dx, dy, direction) {
  hideBubble();
  player.facing = direction;

  const nextX = player.x + dx;
  const nextY = player.y + dy;

  if (!inBounds(nextX, nextY)) {
    setMessage("The snowfield boundary blocks the way.");
    drawGame();
    return;
  }

  if (OUTSIDE_MAPS[currentMap] && isOccupiedByVehicle(nextX, nextY)) {
    setMessage("Vehicle here. Press E beside it to interact.");
    drawGame();
    return;
  }

  if (currentMap === "outside" && isOccupiedByBuilding(nextX, nextY)) {
    setMessage("A building blocks the way.");
    drawGame();
    return;
  }

  if (!OUTSIDE_MAPS[currentMap] && isOccupiedByInteriorTile(nextX, nextY)) {
    setMessage("Interior object blocks the way.");
    drawGame();
    return;
  }

  player.x = nextX;
  player.y = nextY;

  const nextSymbol = getActiveMap()[nextY]?.[nextX];

if (OUTSIDE_MAPS[currentMap] && nextSymbol === "R") {
  showBubble(
  "CHECKPOINT",
  "ACCESS DENIED. Authorized snow bus transit only."
);
setMessage("Checkpoint access denied.");
  drawGame();
  return;
}

  drawGame();
}

// ------------------------------------------------------------
// VEHICLE MOVEMENT
// ------------------------------------------------------------

function getVehicleSizeForDirection(vehicle, direction) {
  if (vehicle.type === "snowbus") {
  if (direction === "left" || direction === "right") {
    return { width: 4, height: 2 };
  }

  if (direction === "up" || direction === "down") {
    return { width: 2, height: 4 };
  }
}
  
  if (vehicle.type === "operator") {
    return { width: 2, height: 2 };
  }

  if (vehicle.type === "snowmobile") {
    if (direction === "left" || direction === "right") {
      return { width: 2, height: 1 };
    }

    if (direction === "up" || direction === "down") {
      return { width: 1, height: 2 };
    }
  }

  return { width: vehicle.width, height: vehicle.height };
}

function canVehicleMove(vehicle, nextX, nextY, nextWidth, nextHeight) {
  for (let yy = 0; yy < nextHeight; yy++) {
    for (let xx = 0; xx < nextWidth; xx++) {
      const checkX = nextX + xx;
      const checkY = nextY + yy;

      if (!inBounds(checkX, checkY)) return false;
      if (isOccupiedByVehicle(checkX, checkY, vehicle.id)) return false;
      if (currentMap === "outside" && isOccupiedByBuilding(checkX, checkY)) return false;
    }
  }

  return true;
}

function moveCurrentVehicle(dx, dy, direction) {
  hideBubble();
  const vehicle = currentVehicle;
  const newSize = getVehicleSizeForDirection(vehicle, direction);

  vehicle.facing = direction;

  const nextX = vehicle.x + dx;
  const nextY = vehicle.y + dy;

  const nextSymbol = getActiveMap()[nextY]?.[nextX];

if (vehicle.type === "snowbus" && nextSymbol === "R") {

  if (currentMap === "outside") {
    transferSnowbusToRoadMap();
  } else if (currentMap === "roadMap") {
    transferSnowbusToScmf();
  }

  return;
}

  if (!canVehicleMove(vehicle, nextX, nextY, newSize.width, newSize.height)) {
    setMessage("The vehicle cannot move there.");
    vehicle.width = newSize.width;
    vehicle.height = newSize.height;
    drawGame();
    return;
  }

  vehicle.x = nextX;
  vehicle.y = nextY;
  vehicle.width = newSize.width;
  vehicle.height = newSize.height;

  setMessage("Driving " + vehicle.name + ".");
  drawGame();
}


function transferSnowbusToRoadMap() {
  currentMap = "roadMap";

  moveVehicleToMap(currentVehicle, "roadMap", 5, 12, "right", 4, 2);

  setMessage("The snow bus passes through the checkpoint into the regional road.");
  drawGame();
}

function transferSnowbusToScmf() {
  currentMap = "outside";

  moveVehicleToMap(currentVehicle, "outside", 26, 12, "left", 4, 2);

  setMessage("The snow bus returns to SCMF.");
  drawGame();
}

// ------------------------------------------------------------

function getBuildingDoorAtPlayer() {
  for (const building of buildings) {
    const localX = player.x - building.x;
    const localY = player.y - building.y;

    if (
      localX < 0 ||
      localY < 0 ||
      localX >= building.width ||
      localY >= building.height
    ) {
      continue;
    }

    const cell = building.collision[localY][localX];
    if (cell === "D") return building;
  }

  return null;
}

function playerIsBesideVehicle(vehicle) {
  const footprint = getVehicleFootprint(vehicle);

  for (const spot of footprint) {
    if (areAdjacent(player.x, player.y, spot.x, spot.y)) return true;
  }

  return false;
}

function getAdjacentVehicle() {
  for (const vehicle of getActiveVehicles()) {
    if (!vehicle.occupied && playerIsBesideVehicle(vehicle)) return vehicle;
  }

  return null;
}

function getAdjacentNpc() {
  for (const npc of npcs) {
    if (!npc.visible) continue;
    if (areAdjacent(player.x, player.y, npc.x, npc.y)) return npc;
  }

  return null;
}

// ------------------------------------------------------------

function enterVehicle(vehicle) {
  mode = "driving";
  currentVehicle = vehicle;
  vehicle.occupied = true;

  setMessage("Entered " + vehicle.name + ".");
  drawGame();
}

function exitVehicle() {
  const vehicle = currentVehicle;
  const exitSpot = findExitSpot(vehicle);

  if (!exitSpot) {
    setMessage("No safe place to exit.");
    return;
  }

  player.x = exitSpot.x;
  player.y = exitSpot.y;
  player.facing = vehicle.facing;

  vehicle.occupied = false;
  mode = "walking";
  currentVehicle = null;

  setMessage("Exited vehicle.");
  drawGame();
}

function findExitSpot(vehicle) {
  let exitSpot;

  if (vehicle.facing === "up") {
    exitSpot = { x: vehicle.x - 1, y: vehicle.y };
  }

  if (vehicle.facing === "left") {
    exitSpot = { x: vehicle.x, y: vehicle.y + vehicle.height };
  }

  if (vehicle.facing === "down") {
    exitSpot = { x: vehicle.x + vehicle.width, y: vehicle.y };
  }

  if (vehicle.facing === "right") {
    exitSpot = { x: vehicle.x, y: vehicle.y - 1 };
  }

  if (!exitSpot) return null;
  if (!inBounds(exitSpot.x, exitSpot.y)) return null;
  if (isOccupiedByVehicle(exitSpot.x, exitSpot.y, vehicle.id)) return null;
  if (currentMap === "outside" && isOccupiedByBuilding(exitSpot.x, exitSpot.y)) return null;

  return exitSpot;
}

// ------------------------------------------------------------
// MAIN INTERACTION
// ------------------------------------------------------------

function interact() {

 if (playerIsBesideExchange()) {
  openExchangeOverlay();
  return;
}

  if (mode === "driving") {
    exitVehicle();
    return;
  }

  if (OUTSIDE_MAPS[currentMap] && mode === "walking") {
    if (currentMap === "outside") {
      const building = getBuildingDoorAtPlayer();

      if (building) {
        enterOutpostBlueprint(building);
        return;
      }

      const npc = getAdjacentNpc();

      if (npc && npc.id === "unrecognizer-dealer") {
        talkToDealer(npc);
        return;
      }
    }

    const vehicle = getAdjacentVehicle();

    if (!vehicle) {
      setMessage("No vehicle or door close enough.");
      return;
    }

    enterVehicle(vehicle);
    return;
  }

  if (!OUTSIDE_MAPS[currentMap]) {
    const symbol = BLUEPRINTS[currentMap][player.y]?.[player.x];

if (symbol === "^" && currentMap === "scmfBusArrival") {
  enterBlueprintRoom("cafeteria", 3, 5, "up");
  return;
}

if (symbol === "^" && currentMap === "cafeteria") {
  enterBlueprintRoom("scmfBusArrival", 9, 1, "down");
  return;
}

    if (symbol === "D" || symbol === "P") {
      exitOutpostBlueprint();
      return;
    }

    if (playerIsBesidePhone()) {
      openPhoneOverlay();
      return;
    }

const npc = getAdjacentNpc();

if (npc && npc.id === "yord") {
  talkToYord();
  return;
}

    setMessage("Nothing to use here.");
  }
}

// ------------------------------------------------------------
// BACK BUTTON / MENU PLACEHOLDER
// ------------------------------------------------------------

function backAction() {
  if (mode === "driving") {
    setMessage("Back selected. Press E to exit the vehicle.");
  } else {
    setMessage("Back selected. No menu is open yet.");
  }
}

// ------------------------------------------------------------
// KEYBOARD CONTROLS
// ------------------------------------------------------------

document.addEventListener("keydown", function(event) {
  const key = event.key.toLowerCase();

if (viewingExchange) {
  event.preventDefault();

  if (key === "1") {
    setMessage("100 Merit exchange selected. Token system not wired yet.");
  }

  if (key === "2") {
    setMessage("500 Merit exchange selected. Token system not wired yet.");
  }

  if (key === "3") {
    setMessage("1000 Merit exchange selected. Token system not wired yet.");
  }

  if (key === "4" || key === "b" || key === "escape") {
    closeExchangeOverlay();
  }

  return;
}
  if (usingPhone) {
    handlePhoneInput(key, event);
    return;
  }

  if (key === "arrowup") {
    event.preventDefault();
    if (mode === "walking") movePlayer(0, -1, "up");
    else moveCurrentVehicle(0, -1, "up");
  }

  if (key === "arrowdown") {
    event.preventDefault();
    if (mode === "walking") movePlayer(0, 1, "down");
    else moveCurrentVehicle(0, 1, "down");
  }

  if (key === "arrowleft") {
    event.preventDefault();
    if (mode === "walking") movePlayer(-1, 0, "left");
    else moveCurrentVehicle(-1, 0, "left");
  }

  if (key === "arrowright") {
    event.preventDefault();
    if (mode === "walking") movePlayer(1, 0, "right");
    else moveCurrentVehicle(1, 0, "right");
  }

  if (key === "e") {
    interact();
  }

  if (key === "b") {
    backAction();
  }
});

drawGame();
</script>
