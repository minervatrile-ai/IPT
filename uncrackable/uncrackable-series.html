<!DOCTYPE html>
<html lang="en">
<head>

    <title>the Uncrackable Series</title>

        body {

        .card-container {

        .card {
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: rgb(255, 255, 255);
        }

        .card img {
            width: 100%;
            display: block;
        }
        .card {
  height: fit-content;
}
    </style>
</head>
<body>
   <div class="card-container">
      <div class="card">
        <img src="../gallery/uncrackable-redheart-1.jpg" alt="uncrackable series 1">
      </div>
      <div class="card">
        <img src="../gallery/uncrackable-redheart-load-bearing-self.jpg" alt="load-bearing self">
      </div>
      <div class="card">
        <img src="../gallery/uncrackable-redheart-loop-immunity.jpg" alt="loop immunity">
      </div>
      <div class="card">
        <img src="../gallery/uncrackable-redheart-exit-tolerance.jpg" alt="exit tolerance">
      </div>
      <div class="card">
        <img src="../gallery/uncrackable-redheart-post-awareness-stability.jpg" alt="post-awareness stability">
      </div>
      <div class="card">
        <img src="../gallery/uncrackable-redheart-identity-non-attachment.jpg" alt="identity non-attachment">
      </div>
      <div class="card">
        <img src="../gallery/uncrackable-redheart-field-control.jpg" alt="field control">
      </div>
      <div class="card">
        <img src="../gallery/uncrackable-redheart-calm-signal-output.jpg" alt="calm signal output">
      </div>
      <div class="card">
        <img src="../gallery/uncrackable-redheart-complete.jpg" alt="complete red heart series">
      </div>
   </div>

</html>
